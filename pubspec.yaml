
name: sample_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  file_picker: 8.1.2
  shared_preferences: ^2.5.6
  video_player: ^2.14.1
  just_audio: ^0.10.6
  audio_session: ^0.2.4
  path_provider: ^2.1.6
  flutter_blue_plus: ^2.3.14
  provider: ^6.1.5+1
  permission_handler: ^12.0.1
  flutter_local_notifications: ^19.5.0
  flutter_timezone: ^5.0.0
  timezone: ^0.10.1
  google_sign_in: ^7.0.0
  flutter_secure_storage: ^9.0.0
  http: ^1.6.0

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato-Thin.ttf
          weight: 100
        - asset: assets/fonts/Lato-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Lato-Light.ttf
          weight: 300
        - asset: assets/fonts/Lato-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Lato-Regular.ttf
          weight: 400
        - asset: assets/fonts/Lato-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Lato-Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Lato-Black.ttf
          weight: 900
        - asset: assets/fonts/Lato-BlackItalic.ttf
          weight: 900
          style: italic

  assets:
    - assets/images/garden-wall.png
    - assets/audio/
    - assets/flower/
    - assets/images/plants/
    - assets/images/

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  remove_alpha_ios: true
  adaptive_icon_background: "#163D2B"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
